<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>demon slayer</title>
</head>
<body>

<div class="infinity-castle-desktop-wallpaper">

</div>

<div class="akaza-title-text">

    </div>
    
    <!-- Animierte Bilder unten im Akaza Eye -->

<div class="douma-title-text">  
    <h1>Douma 2 upper moon</h1>
</div>

    <h1>Kokushibo 1 upper moon</h1>
</div>
<!-- Kokushibo Eye Section -->

    </div>
